# Models under test (SPEC §3): 5 slots, pinned 2026-08-18, routed via
# OpenRouter (single OPENROUTER_API_KEY funds every model; IDs verified
# against the live OpenRouter catalog). The runner disables OpenRouter
# provider fallbacks so a request is never silently rerouted; this
# routing choice is disclosed on the methodology page.
#
# snapshot_id records the vendor's model identity (shown on the
# leaderboard); litellm_id carries the OpenRouter route. Note: the
# open-weights Llama slot may be served by different OpenRouter backends
# across runs (disclosed limitation); the closed models proxy their
# first-party APIs. `lab` drives self-lab judge exclusion (SPEC §5).
models:
  - name: gpt
    lab: openai
    litellm_id: openrouter/openai/gpt-5.6-sol
    snapshot_id: gpt-5.6-sol
  - name: claude
    lab: anthropic
    litellm_id: openrouter/anthropic/claude-opus-5
    snapshot_id: claude-opus-5
  - name: gemini
    lab: google
    litellm_id: openrouter/google/gemini-3.7-flash
    snapshot_id: gemini-3.7-flash
  - name: llama
    lab: meta
    litellm_id: openrouter/meta-llama/llama-3.3-70b-instruct
    snapshot_id: llama-3.3-70b-instruct
  - name: grok
    lab: xai
    litellm_id: openrouter/x-ai/grok-4.6
    snapshot_id: grok-4.6
